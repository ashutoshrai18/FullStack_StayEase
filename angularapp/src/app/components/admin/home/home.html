<div *ngIf="isLoading" class="d-flex justify-content-center align-items-center" style="height: 300px;">
  <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>


<div *ngIf="!isLoading" class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">Overview</h3>
    <span class="text-muted">Welcome back, Admin 👋</span>
  </div>
  <div class="row g-4">
    <div class="col-md-3">
      <a routerLink="/dashboard/booking">
        <div class="card shadow-sm stats-card">
          <div class="card-body d-flex align-items-center">
            <i class="bi bi-calendar-check fs-2 text-primary me-3"></i>
            <div>
              <h6 class="mb-0">Bookings</h6>
              <h4 class="fw-bold">{{ bookingsCount }}</h4>
            </div>
          </div>
        </div>
      </a>
    </div>
    <div class="col-md-3">
      <a routerLink="/dashboard/payment">
        <div class="card shadow-sm stats-card">
          <div class="card-body d-flex align-items-center">
            <i class="bi bi-cash-coin fs-2 text-success me-3"></i>
            <div>
              <h6 class="mb-0">Payments</h6>
              <h4 class="fw-bold">₹{{ paymentsTotal }}</h4>
            </div>
          </div>
        </div>
      </a>
    </div>
    <div class="col-md-3">
      <a routerLink="/dashboard/user">
        <div class="card shadow-sm stats-card">
          <div class="card-body d-flex align-items-center">
            <i class="bi bi-people fs-2 text-warning me-3"></i>
            <div>
              <h6 class="mb-0">Users</h6>
              <h4 class="fw-bold">{{ usersCount }}</h4>
            </div>
          </div>
        </div>
      </a>
    </div>
    <div class="col-md-3">
      <a routerLink="/dashboard/hotel">
        <div class="card shadow-sm stats-card">
          <div class="card-body d-flex align-items-center">
            <i class="bi bi-building fs-2 text-danger me-3"></i>
            <div>
              <h6 class="mb-0">Hotels</h6>
              <h4 class="fw-bold">{{ hotelsCount }}</h4>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>
  <div class="row mt-4 g-4">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">Booking Trends</div>
        <div class="card-body">
          <div class="chart-placeholder">
            <ngx-charts-line-chart
              [results]="bookingTrends"
              [scheme]="colorScheme"
              [xAxis]="true"
              [yAxis]="true"
              [legend]="true"
              [autoScale]="true">
            </ngx-charts-line-chart>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">Recent Users</div>
        <div class="card-body">
          <ul class="list-group list-group-flush">
            <li *ngFor="let user of recentUsers" class="list-group-item">{{ user.name }}</li>
            <li *ngIf="recentUsers.length === 0" class="list-group-item text-center">No recent users</li>
            <li class="list-group-item text-center"><a routerLink="/dashboard/user">View All</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
