<div class="card mt-3">
        <div class="card-body">
          <h2 class="card-title mb-4">Users</h2>
          <button class="btn btn-success mb-3" (click)="editUser({ name: '', email: '', phoneNumber: '', password: '', address: '' })">Add User</button>
          <div *ngIf="isLoading" class="mb-2">Loading...</div>
          <div *ngIf="!isLoading && users.length === 0" class="mb-2">No users found.</div>
          <table *ngIf="users.length > 0" class="table table-striped">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone No.</th>
                <th>Address</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of users; let i = index">
                <td>{{ user.userId }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.phoneNumber }}</td>
                <td>{{ user.address }}</td>
                <td>
                  <button class="btn btn-sm btn-primary me-2" (click)="editUser(user)">Edit</button>
                  <button class="btn btn-sm btn-danger" (click)="deleteUser(user.userId!)">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Add/Edit User Modal -->
      <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <form class="modal-content" (ngSubmit)="addUser()">
            <div class="modal-header">
              <h5 class="modal-title" id="addUserModalLabel">{{ editingIndex !== null ? 'Edit User' : 'Add User' }}</h5>
              <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label>Name</label>
                <input type="text" class="form-control" [(ngModel)]="newUser.name" name="name" required>
              </div>
              <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" [(ngModel)]="newUser.email" name="email" required>
              </div>
              <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" class="form-control" [(ngModel)]="newUser.phoneNumber" name="phoneNumber" required>
              </div>
              <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" [(ngModel)]="newUser.password" name="password" required>
              </div>
              <div class="mb-3">
                <label>Address</label>
                <input type="text" class="form-control" [(ngModel)]="newUser.address" name="address">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
              <button type="submit" class="btn btn-primary">{{ editingIndex !== null ? 'Update' : 'Add' }}</button>
            </div>
          </form>
        </div>
      </div>
