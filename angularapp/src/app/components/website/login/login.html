<div class="parent-div">
  <div class="container justify-content-center">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card p-4">
          <h3 class="text-center mb-4">Login</h3>
          <form>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Enter your email" required [(ngModel)]="email" name="email">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" placeholder="Enter your password" required [(ngModel)]="password" name="password">
            </div>
            <div class="d-grid">

                <button type="submit" class="btn btn-primary"  (click)="onLogin()">Login</button>

            </div>
          </form>

          <p class="mt-3 text-center">
            <a routerLink="/signup">
              Don’t have an account?
              Signup</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
